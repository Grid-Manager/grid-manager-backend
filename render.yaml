services:
  - type: web
    name: grid-manager-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/categories
    envVars:
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: grid-manager-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: grid-manager-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: grid-manager-postgres
          property: password
      - key: GRID_MANAGER_JWT_SECRET
        generateValue: true
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx240m -XX:ActiveProcessorCount=2"

databases:
  - name: grid-manager-postgres
    databaseName: gridmanager
    user: gridmanager
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []
