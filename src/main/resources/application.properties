# ===================================================================
# Configuration the aplication
# ===================================================================
spring.application.name=grid-manager-back
server.port=8080

# ===================================================================
# Database Configuration (PostgreSQL via Docker)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gridmanager_db
spring.datasource.username=gridmanager
spring.datasource.password=gridmanager_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# Disables automatic creation by Hibernate (Flyway takes over this responsibility)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Exibe e formata as queries SQL na consola para facilidade de depuração
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Flyway Configuration (Database Versioning)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# OpenAPI / Swagger Documentation Configuration
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Habilite somente quando GRID_MANAGER_OPENAI_API_KEY estiver configurada no ambiente.
grid-manager.moderation.openai-enabled=false
